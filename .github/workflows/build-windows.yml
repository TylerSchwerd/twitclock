name: Build Windows executables

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TwitClock.sln

      - name: Build
        run: dotnet build TwitClock.sln --configuration Release --no-restore

      - name: Run timer logic tests
        run: dotnet run --project tests/TwitClock.Core.Tests/TwitClock.Core.Tests.csproj --configuration Release --no-build

      - name: Run Windows UI behaviour tests
        run: dotnet run --project tests/TwitClock.Ui.Tests/TwitClock.Ui.Tests.csproj --configuration Release --no-build

  publish:
    name: Publish ${{ matrix.runtime }}
    needs: test
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64
          - win-x86

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained executable
        shell: pwsh
        run: ./build.ps1 -RuntimeIdentifier ${{ matrix.runtime }}

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TwitClock-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}/TwitClock.exe
          if-no-files-found: error
